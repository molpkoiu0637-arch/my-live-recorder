<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BIGO V24 LIVE</title><style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:14px}.card{background:#1c1c1e;border-radius:18px;padding:18px;margin:14px 0;border:1px solid #2c2c2e}input{width:100%;padding:18px;border-radius:14px;border:2px solid #ff9500;background:#2c2c2e;color:#fff;font-size:15px;box-sizing:border-box}button{width:100%;padding:18px;border-radius:14px;border:none;font-weight:800;font-size:18px;margin:10px 0}.btn-orange{background:#ff9500;color:#000}.badge{background:#30d158;color:#000;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800}pre{background:#000;padding:12px;border-radius:10px;white-space:pre-wrap;font-size:11px;max-height:600px;overflow:auto}</style></head><body><h2>BIGO V24 <span class=badge>LIVE FIX - ใช้ b/h/mk</span></h2><div class=card><input id=url placeholder="วาง slink หรือ sid แบบเต็มๆ ที่มี ?b= &h= &mk="><button class=btn-orange onclick=start()>🔴 วางแล้วกดบันทึกเลย (แก้ตอนไลฟ์สด)</button><div id=status style=font-weight:bold;margin-top:12px></div><div id=list></div></div><script>async function start(){let raw=document.getElementById('url').value.trim();if(!raw){alert('วางก่อน');return;}let url=(raw.match(/https?:\/\/[^\s]+/)||[raw])[0];document.getElementById('status').innerHTML='⏳ กำลังแกะแบบ LIVE...';let r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});let j=await r.json();document.getElementById('status').innerHTML='✅ '+j.siteid+'<br>'+j.status_msg+'<br>'+j.resolved.slice(0,200);load();}async function load(){let r=await fetch('/api/list');let j=await r.json();let h='';j.forEach(it=>{let c=it.status=='done'?'#30d158':(it.status=='offline'?'#ff9500':'#ff3b30');h+=`<div class=card style=border-left:5px solid ${c}><b style=color:${c}>${it.status.toUpperCase()}</b> ${it.status_msg}<br><small>${it.resolved.slice(0,250)}</small><pre>${(it.log||'').slice(-8000)}</pre></div>`;});document.getElementById('list').innerHTML=h;}setInterval(load,3000);load();</script></body></html>
