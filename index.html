<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BIGO V22 SINGAPORE</title><style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:14px}.card{background:#1c1c1e;border-radius:18px;padding:18px;margin:14px 0;border:1px solid #2c2c2e}input{width:100%;padding:18px;border-radius:14px;border:2px solid #ff9500;background:#2c2c2e;color:#fff;font-size:16px;box-sizing:border-box}button{width:100%;padding:18px;border-radius:14px;border:none;font-weight:800;font-size:18px;margin:10px 0}.btn-orange{background:#ff9500;color:#000}.badge{background:#30d158;color:#000;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800}pre{background:#000;padding:12px;border-radius:10px;white-space:pre-wrap;font-size:12px;max-height:500px;overflow:auto}.small{color:#8e8e93;font-size:13px;line-height:1.5}</style></head><body><h2>BIGO V22 <span class=badge>SINGAPORE - วางแล้วอัดเลย</span></h2><p class=small>Server สิงคโปร์ ไม่โดนบล็อกแล้ว วาง slink / bigo.tv/th/xxx / ชื่อยูส แล้วกดเลย</p><div class=card><p style=color:#ff9500;font-weight:bold>วางตรงนี้เลย 👇</p><input id=url placeholder="วางลิงก์ เช่น https://slink.bigovideo.tv/xxxx หรือ https://www.bigo.tv/th/1140986432"><button class=btn-orange onclick=start()>🔴 วางแล้วกดบันทึกเลย</button><div id=status style=color:#30d158;font-weight:bold;margin-top:12px;font-size:14px"></div><div id=list style=margin-top:16px></div></div><script>async function start(){let raw=document.getElementById('url').value.trim();if(!raw){alert('วางลิงก์ก่อน');return;}let url=(raw.match(/https?:\/\/[^\s]+/)||[raw])[0];document.getElementById('status').innerHTML='⏳ กำลังแกะ... '+url.slice(0,80);try{let r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});let j=await r.json();if(j.error){document.getElementById('status').innerHTML='❌ '+j.error;return;}document.getElementById('status').innerHTML='✅ OK ID '+j.id+'<br>📍 '+j.resolved.slice(0,150)+'<br>🆔 '+j.siteid;load();}catch(e){document.getElementById('status').innerHTML='❌ '+e;}}async function load(){let r=await fetch('/api/list');let j=await r.json();let h='';j.forEach(it=>{let color=it.status=='done'?'#30d158':(it.status=='error'?'#ff3b30':'#ff9500');h+=`<div class=card style=border-left:5px solid ${color}><b style=color:${color}>${it.status.toUpperCase()}</b> - ${it.time}<br><small>${it.resolved.slice(0,200)}</small><br><small>SiteID: ${it.siteid}</small><pre>${(it.log||'').slice(-5000)}</pre></div>`;});document.getElementById('list').innerHTML=h;}setInterval(load,3000);load();</script></body></html>
